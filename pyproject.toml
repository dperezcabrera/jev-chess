[project]
name = "system-one-chess"
version = "0.5.0"
description = "How good is a System One model at chess? Play Jev or Laya and measure their moves with Stockfish"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11,<2",
    "pico-boot>=0.2.0",
    "pico-fastapi[session]>=0.4.1",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pico-testing>=0.2.0", "pytest>=8", "ruff>=0.6"]
laya = ["laya>=0.3.5"]

[project.scripts]
system-one-chess = "system_one_chess.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["system_one_chess"]

[tool.setuptools.package-data]
system_one_chess = ["static/**/*", "models.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
