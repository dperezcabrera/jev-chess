<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jev-chess</title>
<link rel="stylesheet" href="static/vendor/chessground/chessground.base.css">
<link rel="stylesheet" href="static/vendor/chessground/chessground.brown.css">
<link rel="stylesheet" href="static/vendor/chessground/chessground.cburnett.css">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<main class="layout">
  <section class="board-area" aria-label="Chess board">
    <div id="board" class="board"></div>
  </section>

  <aside class="panel">
    <header class="panel-header">
      <h1>jev-chess</h1>
      <p class="subtitle">You against Jev, TypeSafe's System One model</p>
      <p class="game-id">Game <span id="game-id">&ndash;</span></p>
    </header>

    <div id="status" class="status" role="status" aria-live="polite">
      <span id="spinner" class="spinner" hidden aria-hidden="true"></span>
      <span id="status-text">Loading</span>
      <button id="retry" class="button button-small" type="button" hidden>
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        Retry
      </button>
    </div>

    <section aria-labelledby="decision-title">
      <h2 id="decision-title">Jev's last decision</h2>
      <table class="decision">
        <thead><tr><th class="col-move" scope="col">Move</th><th class="col-prob" scope="col">Probability</th></tr></thead>
        <tbody id="decision"></tbody>
      </table>
    </section>

    <section class="moves-section" aria-labelledby="moves-title">
      <h2 id="moves-title">Moves</h2>
      <div id="moves-box" class="moves-box" tabindex="0" aria-labelledby="moves-title">
        <p id="moves-empty" class="empty">No moves yet</p>
        <ol id="moves" class="moves"></ol>
      </div>
    </section>

    <div class="controls">
      <div class="field">
        <label for="promotion">Promote to</label>
        <select id="promotion">
          <option value="q">Queen</option>
          <option value="r">Rook</option>
          <option value="b">Bishop</option>
          <option value="n">Knight</option>
        </select>
      </div>
      <button id="new-game" class="button" type="button">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6z"/></svg>
        New game
      </button>
    </div>
  </aside>
</main>
<dialog id="side-dialog" class="side-dialog" aria-labelledby="side-title">
  <form id="side-form" method="dialog" class="side-form">
    <header class="side-header">
      <h2 id="side-title">Choose your side</h2>
      <p>Jev answers every move with a single typed decision.</p>
    </header>

    <fieldset class="side-options">
      <legend class="visually-hidden">Side</legend>

      <label class="side-card side-card-white">
        <input type="radio" name="human" value="white" checked>
        <span class="side-art cg-wrap" aria-hidden="true"><piece class="king white"></piece></span>
        <span class="side-name">White</span>
        <span class="side-hint">You move first</span>
        <svg class="side-check" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.6 14.6L6 12.2l1.4-1.4 3 3 6.2-6.2L18 9l-7.6 7.6z"/></svg>
      </label>

      <label class="side-card side-card-black">
        <input type="radio" name="human" value="black">
        <span class="side-art cg-wrap" aria-hidden="true"><piece class="king black"></piece></span>
        <span class="side-name">Black</span>
        <span class="side-hint">Jev opens the game</span>
        <svg class="side-check" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.6 14.6L6 12.2l1.4-1.4 3 3 6.2-6.2L18 9l-7.6 7.6z"/></svg>
      </label>

      <label class="side-card side-card-watch">
        <input type="radio" name="human" value="none">
        <span class="side-art side-art-pair cg-wrap" aria-hidden="true"><piece class="king white"></piece><piece class="king black"></piece></span>
        <span class="side-name">Spectator</span>
        <span class="side-hint">Jev plays both sides</span>
        <svg class="side-check" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.6 14.6L6 12.2l1.4-1.4 3 3 6.2-6.2L18 9l-7.6 7.6z"/></svg>
      </label>
    </fieldset>

    <footer class="side-footer">
      <button id="side-cancel" class="button button-ghost" type="button">Cancel</button>
      <button id="side-start" class="button" type="submit">Start game</button>
    </footer>
  </form>
</dialog>
<script type="module" src="static/app.js"></script>
</body>
</html>
